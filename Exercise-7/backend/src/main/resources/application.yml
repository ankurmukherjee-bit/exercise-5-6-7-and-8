server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/leavedb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080

logging:
  level:
    com.example.leave: INFO
