services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leavedb
      POSTGRES_USER: leaveuser
      POSTGRES_PASSWORD: leavepass
    ports:
      - "5432:5432"
    volumes:
      - leave-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveuser -d leavedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/leavedb
      SPRING_DATASOURCE_USERNAME: leaveuser
      SPRING_DATASOURCE_PASSWORD: leavepass
      CAMUNDA_CLIENT_GRPC_ADDRESS: http://host.docker.internal:26500
      CAMUNDA_CLIENT_REST_ADDRESS: http://host.docker.internal:8080
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  leave-db-data:
